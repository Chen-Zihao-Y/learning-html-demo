<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tag Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>HTML Learning Quiz</h1>
        <p>Test your knowledge of HTML tags</p>
    </header>

    <main class="container">
        <section class="quiz-card">
            <h2>What tag defines a paragraph?</h2>
            <div class="button-group">
                <button class="option-btn" data-correct="false">&lt;div&gt;</button>
                <button class="option-btn" data-correct="true">&lt;p&gt;</button>
                <button class="option-btn" data-correct="false">&lt;span&gt;</button>
                <button class="option-btn" data-correct="false">&lt;h1&gt;</button>
            </div>
            <p id="feedback"></p>
            <p>Score: <span id="score">0</span></p>
        </section>
    </main>

    <footer>
        <p>Static interactive learning page</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
